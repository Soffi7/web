{% extends 'base.html' %}

{% block content %}
    <h2>Удалить предмет?</h2>

    <p>Вы уверены, что хотите удалить предмет <strong>{{ object.title }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" style="color: red;">Да, удалить</button>
        <a href="{% url 'subjects' %}" style="margin-left: 15px;">Отмена</a>
    </form>
{% endblock %}
